services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DEMO_MODE: "true"
      SACHET_DB_PATH: /data/sachet.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sachet-data:/data
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
volumes:
  sachet-data:
